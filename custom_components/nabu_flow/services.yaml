notify:
  fields:
    route:
      required: false
      example: front_door_open
      selector:
        text:
    who:
      required: false
      example: all
      selector:
        text:
    channel:
      required: false
      example: doors
      selector:
        text:
    title:
      required: false
      example: Front door left open
      selector:
        text:
    message:
      required: false
      example: Open for 10 minutes
      selector:
        text:
          multiline: true
    severity:
      required: false
      selector:
        select:
          translation_key: severity
          options:
            - info
            - heads_up
            - critical
    discord:
      required: false
      selector:
        boolean:
    phone:
      required: false
      selector:
        select:
          translation_key: phone
          options:
            - auto
            - none
            - normal
            - urgent
            - critical
    presence:
      required: false
      selector:
        select:
          translation_key: presence
          options:
            - aware
            - ignore
            - home_only
    announce:
      required: false
      selector:
        boolean:
    camera_entity:
      required: false
      selector:
        entity:
          domain: camera
    link:
      required: false
      example: https://example.com/dashboard
      selector:
        text:
    dedupe_key:
      required: false
      selector:
        text:
    cooldown:
      required: false
      selector:
        number:
          min: 0
          max: 86400
          unit_of_measurement: s
          mode: box

alert:
  fields:
    id:
      required: true
      example: dishwasher_done
      selector:
        text:
    message:
      required: true
      example: Dishwasher is done
      selector:
        text:
    name:
      required: false
      example: Dishwasher
      selector:
        text:
    priority:
      required: false
      selector:
        select:
          options:
            - critical
            - warning
            - info
            - low
    icon:
      required: false
      example: mdi:dishwasher
      selector:
        icon:
    duration:
      required: false
      example: 600
      selector:
        number:
          min: 0
          max: 86400
          unit_of_measurement: s
    camera_entity:
      required: false
      selector:
        entity:
          domain: camera
    tap_url:
      required: false
      example: /newui-4-0/cameras
      selector:
        text:

alert_clear:
  fields:
    id:
      required: true
      example: dishwasher_done
      selector:
        text:
